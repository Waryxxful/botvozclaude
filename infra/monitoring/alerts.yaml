displayName: "Voice Bot Alerts"
combiner: OR
conditions:
  - displayName: "STT Latencia Alta (>3s)"
    conditionThreshold:
      filter: 'resource.type="cloud_run_revision" AND metric.type="custom.googleapis.com/voicebot/stt_latency_ms"'
      aggregations:
        - alignmentPeriod: 60s
          perSeriesAligner: ALIGN_PERCENTILE_95
      comparison: COMPARISON_GT
      thresholdValue: 3000
      duration: 120s

  - displayName: "Error Rate > 5%"
    conditionThreshold:
      filter: 'resource.type="cloud_run_revision" AND metric.type="run.googleapis.com/request_count" AND metric.labels.response_code_class="5xx"'
      aggregations:
        - alignmentPeriod: 60s
          perSeriesAligner: ALIGN_RATE
      comparison: COMPARISON_GT
      thresholdValue: 0.05
      duration: 120s

  - displayName: "Llamadas Sin Respuesta (>10)"
    conditionThreshold:
      filter: 'resource.type="cloud_run_revision" AND metric.type="custom.googleapis.com/voicebot/calls_unanswered"'
      aggregations:
        - alignmentPeriod: 300s
          perSeriesAligner: ALIGN_SUM
      comparison: COMPARISON_GT
      thresholdValue: 10
      duration: 300s

notificationChannels: []  # Agregar canal de email/Slack aquí
