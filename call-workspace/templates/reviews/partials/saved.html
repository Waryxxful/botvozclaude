<div class="bg-white rounded-xl border border-gray-200 shadow-sm">
    <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
        <h2 class="font-semibold text-gray-900">Revisión del supervisor</h2>
        <span class="inline-flex items-center gap-1 text-xs font-medium text-green-700 bg-green-50 px-2 py-1 rounded-full">
            <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
            </svg>
            Guardado
        </span>
    </div>

    <div class="px-5 py-4 space-y-3">
        {% if review.extra_data.notes %}
        <div>
            <p class="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Observaciones</p>
            <p class="text-sm text-gray-700">{{ review.extra_data.notes }}</p>
        </div>
        {% endif %}

        {% if review.extra_data.score_override %}
        <div>
            <p class="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Score supervisado</p>
            <span class="text-2xl font-bold
                {% if review.extra_data.score_override >= 8 %}text-green-600
                {% elif review.extra_data.score_override >= 5 %}text-yellow-500
                {% else %}text-red-600{% endif %}">
                {{ review.extra_data.score_override }}<span class="text-sm font-normal text-gray-400">/10</span>
            </span>
        </div>
        {% endif %}

        <p class="text-xs text-gray-400">{{ review.reviewed_at|date:"d/m/Y H:i" }}</p>

        <button
            hx-get="{% url 'reviews:form' review.call_id %}"
            hx-target="#review-section"
            hx-swap="innerHTML"
            class="text-xs text-slate-600 hover:text-slate-900 underline underline-offset-2">
            Editar
        </button>
    </div>
</div>
