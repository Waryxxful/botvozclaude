{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Voice Bot CRM</title>
  <link rel="stylesheet" href="{% static 'assets/vendors/css/vendors.min.css' %}"/>
  <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}"/>
  <link rel="stylesheet" href="{% static 'assets/css/theme.min.css' %}"/>
</head>
<body class="bg-light">
<div class="d-flex align-items-center justify-content-center min-vh-100">
  <div class="card shadow-sm" style="width:400px;">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <h4 class="fw-bold">Voice Bot CRM</h4>
        <p class="text-muted">Ingresa tus credenciales</p>
      </div>
      <form method="post">
        {% csrf_token %}
        {% if form.errors %}
        <div class="alert alert-danger">Usuario o contraseña incorrectos.</div>
        {% endif %}
        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <input type="text" name="username" class="form-control" autofocus required/>
        </div>
        <div class="mb-4">
          <label class="form-label">Contraseña</label>
          <input type="password" name="password" class="form-control" required/>
        </div>
        <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
      </form>
    </div>
  </div>
</div>
<script src="{% static 'assets/vendors/js/vendors.min.js' %}"></script>
</body>
</html>
