<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-800">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — Call Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center">

<div class="w-full max-w-sm">
    <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-white">Call Workspace</h1>
        <p class="text-slate-400 text-sm mt-1">Plataforma de análisis de llamadas</p>
    </div>

    <div class="bg-white rounded-xl shadow-lg p-8">
        {% if form.errors %}
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700">
            Usuario o contraseña incorrectos.
        </div>
        {% endif %}

        <form method="post" class="space-y-5">
            {% csrf_token %}
            <div>
                <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
                <input type="text" name="username" id="id_username" autocomplete="username" required
                    class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-500 focus:border-transparent">
            </div>
            <div>
                <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <input type="password" name="password" id="id_password" autocomplete="current-password" required
                    class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-500 focus:border-transparent">
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit"
                class="w-full bg-slate-800 hover:bg-slate-700 text-white font-medium py-2 px-4 rounded-lg text-sm transition-colors">
                Ingresar
            </button>
        </form>
    </div>
</div>

</body>
</html>
