steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - "$_REGION-docker.pkg.dev/$PROJECT_ID/voicebot/voicebot:$COMMIT_SHA"
      - -t
      - "$_REGION-docker.pkg.dev/$PROJECT_ID/voicebot/voicebot:latest"
      - .

  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - "--all-tags"
      - "$_REGION-docker.pkg.dev/$PROJECT_ID/voicebot/voicebot"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - voicebot
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/voicebot/voicebot:$COMMIT_SHA
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=2
      - --min-instances=1
      - --max-instances=20
      - --concurrency=80
      - --service-account=$_SERVICE_ACCOUNT
      # Variables no sensibles — directas en el deploy
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID
      - --set-env-vars=GCP_REGION=$_REGION
      - --set-env-vars=BOT_PROFILE=$_BOT_PROFILE
      - --set-env-vars=BOT_DEFAULT_LANGUAGE=es-419
      - --set-env-vars=BOT_TTS_VOICE=es-US-Neural2-A
      - --set-env-vars=FIRESTORE_CALLS_COLLECTION=calls
      - --set-env-vars=FIRESTORE_TRANSCRIPTIONS_COLLECTION=transcriptions
      - --set-env-vars=FIRESTORE_CUSTOMERS_COLLECTION=customers
      - --set-env-vars=FIRESTORE_BOT_PROFILES_COLLECTION=bot_profiles
      - --set-env-vars=PUBSUB_TOPIC_CALL_EVENTS=voice-bot-call-events
      - --set-env-vars=APP_PORT=8080
      - --set-env-vars=LOG_LEVEL=INFO
      - --set-env-vars=ENVIRONMENT=production
      # Secrets sensibles — referenciados desde Secret Manager
      # Formato: ENV_VAR=secret-name:latest
      - --set-secrets=TELNYX_API_KEY=voicebot-telnyx-api-key:latest
      - --set-secrets=TELNYX_PUBLIC_KEY=voicebot-telnyx-public-key:latest
      - --set-secrets=TELNYX_SIP_CONNECTION_ID=voicebot-telnyx-sip-connection-id:latest
      - --set-secrets=LIVEKIT_URL=voicebot-livekit-url:latest
      - --set-secrets=LIVEKIT_API_KEY=voicebot-livekit-api-key:latest
      - --set-secrets=LIVEKIT_API_SECRET=voicebot-livekit-api-secret:latest
      - --set-secrets=DEEPGRAM_API_KEY=voicebot-deepgram-api-key:latest

substitutions:
  _REGION: us-central1
  _BOT_PROFILE: default
  # Cuenta de servicio que usará Cloud Run en producción
  # Debe tener roles: Firestore User, Pub/Sub Publisher, Speech-to-Text User, Cloud Text-to-Speech User, Vertex AI User
  _SERVICE_ACCOUNT: voicebot-sa@$PROJECT_ID.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY
